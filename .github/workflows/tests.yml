name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[web,dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: cp-news --database /tmp/cp-news-demo.db demo --output /tmp/demo.md
      - run: cp-news --database /tmp/cp-news-demo.db stats
